[package]
name = "litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone on purpose: opts out of the anchor workspace so litesvm's
# solana v3/v4 crates never unify with the program's anchor 1.0 /
# rollups-sdk graph (stakehouse precedent).
[workspace]

[dependencies]
litesvm = "0.13.1"
solana-account = "3.4.0"
solana-address = { version = "2.6", features = ["decode", "curve25519"] }
solana-instruction = "=3.2.0"
solana-keypair = "3.1"
solana-message = "3.1"
solana-signature = "3.3"
solana-signer = "3.0"
# "3.1" not "3.2": litesvm enables solana-system-interface's `bincode`
# feature, and in v3.2.0 that needs solana-instruction ^3.4.0 — clashing
# with litesvm's own `=3.2.0` pin (stakehouse precedent).
solana-system-interface = "3.1"
solana-transaction = "3.1"
solana-clock = "3"
borsh = "1.7"
sha2 = "0.11"
